<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Система обслуживания серверов{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="{% static 'img/logo.png' %}" type="image/png">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="{% url 'homepage:home' %}">
                        <img src="{% static 'img/logo.png' %}" alt="Логотип Системы обслуживания серверов" class="logo-img">
                        <h1>Система обслуживания серверов</h1>
                    </a>
                </div>
                <nav class="main-nav">
                    <ul>
                        <li><a href="{% url 'homepage:home' %}" {% if request.resolver_match.app_name == 'homepage' %}class="active"{% endif %}>
                            <i class="fas fa-home"></i> Главная
                        </a></li>
                        <li><a href="{% url 'racks:rack_list' %}" {% if request.resolver_match.app_name == 'racks' %}class="active"{% endif %}>
                            <i class="fas fa-server"></i> Стойки
                        </a></li>
                        <li><a href="{% url 'operations:operation_list' %}" {% if request.resolver_match.app_name == 'operations' and request.resolver_match.url_name == 'operation_list' %}class="active"{% endif %}>
                            <i class="fas fa-tools"></i> Операции
                        </a></li>
                        <li><a href="{% url 'operations:statistics' %}" {% if request.resolver_match.url_name == 'statistics' %}class="active"{% endif %}>
                            <i class="fas fa-chart-bar"></i> Статистика
                        </a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="content-wrapper">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Система обслуживания серверов &copy; {% now "Y" %}. Вариант 27.</p>
            <p>Все данные получены из базы данных SQLite через SQL-запросы и переданы в шаблоны Django.</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
